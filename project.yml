name: Eiscue

options:
  minimumXcodeGenVersion: 2.45.0
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"

packages:
  EiscueKit:
    path: .
  SwiftMarkdown:
    url: https://github.com/swiftlang/swift-markdown.git
    exactVersion: 0.9.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0

targets:
  Eiscue:
    type: application
    platform: iOS
    sources:
      - path: Apps/Eiscue
      - path: Apps/Shared
      - path: Vendor/LocalTunnel
        type: folder
        buildPhase: resources
    info:
      path: Apps/Eiscue/Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).agent.continued-processing
        NSCameraUsageDescription: "Take a photo to attach to your message."
        NSMicrophoneUsageDescription: "Turn your speech into text in the message field."
        NSSpeechRecognitionUsageDescription: "Transcribe speech on this device without sending a message automatically."
        NSLocalNetworkUsageDescription: "Discover and connect to this device’s developer services over a local loopback network."
        CFBundleLocalizations: [en, zh-Hans]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSBonjourServices:
          - _remotepairing._tcp
          - _remotepairing-pairable-host._tcp
    dependencies:
      - target: EiscueTunnel
        embed: true
      - package: EiscueKit
        product: EiscueAgentKit
      - package: EiscueKit
        product: EiscueDeviceKit
      - package: SwiftMarkdown
        product: Markdown
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.eiscue.app
        DEVELOPMENT_TEAM: Q2T8TN4ZW6
        CODE_SIGN_ENTITLEMENTS: Apps/Eiscue/Eiscue.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Eiscue
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  EiscueTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/EiscueTunnel
      - path: Apps/Shared
    info:
      path: Apps/EiscueTunnel/Info.plist
      properties:
        CFBundleDisplayName: Eiscue Local Connection
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.eiscue.app.tunnel
        DEVELOPMENT_TEAM: Q2T8TN4ZW6
        CODE_SIGN_ENTITLEMENTS: Apps/EiscueTunnel/EiscueTunnel.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  EiscueUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/EiscueUITests
    dependencies:
      - target: Eiscue
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.eiscue.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Eiscue
        TARGETED_DEVICE_FAMILY: "1,2"

  EiscueAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/EiscueAppTests
      - path: Apps/EiscueTunnel/PacketReflector.swift
      - path: Apps/Shared
    dependencies:
      - target: Eiscue
      - package: EiscueKit
        product: EiscueAgentKit
      - package: EiscueKit
        product: EiscueDeviceKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.eiscue.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Eiscue:
    build:
      targets:
        Eiscue: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: EiscueAppTests
          parallelizable: false
        - name: EiscueUITests
          parallelizable: false
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
