name: Offline helper checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helpers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  helpers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check pairing compatibility and isolated test helpers
        run: python3 -m unittest discover -s Scripts/Tests -p 'test_*.py'
