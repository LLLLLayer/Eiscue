<svg width="960" height="262" xml:lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 262" role="img" aria-labelledby="reflect-t reflect-d"><title id="reflect-t">Packet reflection on the device</title><desc id="reflect-d">Inside one iPhone, packets the app sends to a virtual peer pass through the Packet Tunnel, which swaps the source and destination IP and injects them back into the system for the developer services; replies return the same way. Each side sees the other as the virtual peer, with ports and payloads unchanged.</desc><defs><filter id="bsh" x="-60%" y="-50%" width="220%" height="230%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.13" /></filter><filter id="psh" x="-80%" y="-30%" width="260%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.12" /></filter><marker id="ah" markerWidth="10" markerHeight="10" refX="7.4" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 1.6 L7.6 5 L2 8.4" fill="none" stroke="#AEAEB2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></marker><marker id="ahp" markerWidth="10" markerHeight="10" refX="7.4" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 1.6 L7.6 5 L2 8.4" fill="none" stroke="#5E5CE6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></marker><linearGradient id="g-purple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9A8CFF" /><stop offset="1" stop-color="#5E5CE6" /></linearGradient><linearGradient id="g-blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5AB0FF" /><stop offset="1" stop-color="#0A6CFF" /></linearGradient><linearGradient id="g-teal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#62D6E8" /><stop offset="1" stop-color="#1AA3C0" /></linearGradient><linearGradient id="g-red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF7A7A" /><stop offset="1" stop-color="#FF3B30" /></linearGradient><linearGradient id="g-orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFBE4D" /><stop offset="1" stop-color="#FF8A00" /></linearGradient><linearGradient id="g-graphite" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#AFAFB4" /><stop offset="1" stop-color="#6E6E73" /></linearGradient></defs><rect width="960" height="262" fill="#FFFFFF" /><text x="400.0" y="34.0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#86868B" text-anchor="middle" transform="translate(80,0)">Inside one iPhone</text><rect x="118.0" y="80.0" width="64" height="64" rx="15.0" fill="url(#g-blue)" filter="url(#bsh)" transform="translate(30,0)" /><rect x="118.5" y="80.5" width="63" height="63" rx="14.5" fill="none" stroke="#fff" stroke-opacity=".22" transform="translate(30,0)" /><g transform="translate(30,0) translate(134.0,96.0) scale(2.000)" fill="none" stroke="#fff" stroke-width="0.95" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="5" height="5" rx="1.4" /><rect x="9" y="2" width="5" height="5" rx="1.4" /><rect x="2" y="9" width="5" height="5" rx="1.4" /><rect x="9" y="9" width="5" height="5" rx="1.4" /></g><text x="150.0" y="170.0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="middle" transform="translate(30,0)">App</text><text x="150.0" y="190.0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#86868B" text-anchor="middle" transform="translate(30,0)">Control client</text><rect x="368.0" y="80.0" width="64" height="64" rx="15.0" fill="url(#g-purple)" filter="url(#bsh)" transform="translate(80,0)" /><rect x="368.5" y="80.5" width="63" height="63" rx="14.5" fill="none" stroke="#fff" stroke-opacity=".22" transform="translate(80,0)" /><g transform="translate(80,0) translate(384.0,96.0) scale(2.000)" fill="none" stroke="#fff" stroke-width="0.95" stroke-linecap="round" stroke-linejoin="round"><path d="M2.8 5.4 H12.4 M9.8 2.8 L12.4 5.4 L9.8 8 M13.2 10.6 H3.6 M6.2 8 L3.6 10.6 L6.2 13.2" /></g><text x="400.0" y="170.0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="middle" transform="translate(80,0)">Packet Tunnel</text><text x="400.0" y="190.0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#86868B" text-anchor="middle" transform="translate(80,0)">Swaps source and destination IP</text><rect x="618.0" y="80.0" width="64" height="64" rx="15.0" fill="url(#g-graphite)" filter="url(#bsh)" transform="translate(130,0)" /><rect x="618.5" y="80.5" width="63" height="63" rx="14.5" fill="none" stroke="#fff" stroke-opacity=".22" transform="translate(130,0)" /><g transform="translate(130,0) translate(634.0,96.0) scale(2.000)" fill="none" stroke="#fff" stroke-width="0.95" stroke-linecap="round" stroke-linejoin="round"><rect x="1.6" y="2.6" width="12.8" height="10.8" rx="2" /><path d="M4.6 6.4 L6.6 8 L4.6 9.6 M8.2 10 H11.2" /></g><text x="650.0" y="170.0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="middle" transform="translate(130,0)">Developer services</text><text x="650.0" y="190.0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#86868B" text-anchor="middle" transform="translate(130,0)">System process</text><path d="M226 100 H432" fill="none" stroke="#C7C7CC" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)" /><path d="M526 100 H732" fill="none" stroke="#5E5CE6" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ahp)" /><path d="M734 124 H528" fill="none" stroke="#C7C7CC" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)" /><path d="M434 124 H228" fill="none" stroke="#5E5CE6" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ahp)" /><text x="275.0" y="86.0" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#86868B" text-anchor="middle" transform="translate(55,0)">10.7.1.1 → 10.7.0.1</text><text x="525.0" y="86.0" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#5E5CE6" text-anchor="middle" transform="translate(105,0)">10.7.0.1 → 10.7.1.1</text><text x="525.0" y="146.0" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" fill="#86868B" text-anchor="middle" transform="translate(105,0)">10.7.1.1 → 10.7.0.1</text><text x="275.0" y="146.0" font-family="'SF Mono', ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#5E5CE6" text-anchor="middle" transform="translate(55,0)">10.7.0.1 → 10.7.1.1</text><text x="400.0" y="236.0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="500" fill="#1D1D1F" text-anchor="middle" transform="translate(80,0)">Each side sees the other as 10.7.0.1; ports and payloads are unchanged</text></svg>
