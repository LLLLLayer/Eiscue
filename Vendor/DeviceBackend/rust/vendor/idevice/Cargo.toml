# Eiscue native feature closure of the pinned MIT idevice/Device Hub baseline.
[package]
"name" = "idevice"
"description" = "A Rust library to interact with services on iOS devices."
"authors" = ["Jackson Coxson"]
"version" = "0.1.65"
"edition" = "2024"
"license" = "MIT"
"documentation" = "https://docs.rs/idevice"
"repository" = "https://github.com/jkcoxson/idevice"
"keywords" = ["lockdownd", "ios"]
"metadata" = { "docs" = { "rs" = { "all-features" = true, "rustdoc-args" = ["--cfg", "docsrs"] } } }

[dependencies]
"aes" = { "version" = "0.8", "optional" = true }
"async-stream" = { "version" = "0.3.6", "optional" = true }
"base64" = { "version" = "0.22" }
"cbc" = { "version" = "0.1", "features" = ["alloc"], "optional" = true }
"chacha20poly1305" = { "version" = "0.10", "optional" = true }
"ed25519-dalek" = { "version" = "2", "features" = ["rand_core"], "optional" = true }
"flate2" = { "version" = "1", "optional" = true }
"futures" = { "version" = "0.3", "optional" = true }
"hkdf" = { "version" = "0.12", "optional" = true }
"hmac" = { "version" = "0.12", "optional" = true }
"idevice-srp" = { "version" = "0.6", "optional" = true }
"indexmap" = { "version" = "2.11", "features" = ["serde"], "optional" = true }
"jktcp" = { "version" = "0.1.6", "optional" = true, "default-features" = false }
"ns-keyed-archive" = { "version" = "0.1.5", "optional" = true }
"plist" = { "version" = "1.8" }
"plist-macro" = { "version" = "0.1.6" }
"rand" = { "version" = "0.10" }
"rsa" = { "version" = "0.9", "optional" = true, "features" = ["sha2"] }
"rustls" = { "version" = "0.23", "default-features" = false, "features" = ["std", "tls12"], "optional" = true }
"serde" = { "version" = "1", "features" = ["derive"] }
"serde_json" = { "version" = "1", "optional" = true }
"sha1" = { "version" = "0.10", "optional" = true }
"sha2" = { "version" = "0.10", "optional" = true, "features" = ["oid"] }
"siphasher" = { "version" = "1", "optional" = true }
"thiserror" = { "version" = "2" }
"tokio" = { "version" = "1", "features" = ["io-util", "time"] }
"tokio-rustls" = { "version" = "0.26", "default-features" = false, "optional" = true }
"tracing" = { "version" = "0.1.41" }
"uuid" = { "version" = "1.18", "features" = ["serde", "v3", "v4"], "optional" = true }
"web-time" = { "version" = "1", "optional" = true }
"x25519-dalek" = { "version" = "2", "optional" = true }
"zeroize" = { "version" = "1", "optional" = true }

[target.'cfg(not(windows))'.dependencies]
libc = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["fs"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "rt", "sync", "time", "macros"] }

[features]
default = []
"_http" = []
"_serde_json" = ["dep:serde_json"]
"afc" = []
"amfi" = []
"application_listing" = []
"aws-lc" = []
"bt_packet_logger" = []
"companion_proxy" = []
"condition_inducer" = []
"core_device" = ["xpc", "dep:uuid", "dep:ns-keyed-archive"]
"core_device_proxy" = []
"crashreportcopymobile" = []
"debug_proxy" = []
"device_info" = []
"diagnostics_relay" = []
"display_stream" = ["core_device", "rsd", "dep:flate2", "dep:futures", "dep:web-time"]
"dvt" = ["dep:ns-keyed-archive", "tokio/sync", "tokio/rt", "tokio/macros"]
"energy_monitor" = []
"full" = []
"graphics" = []
"heartbeat" = []
"house_arrest" = []
"installation_proxy" = []
"installcoordination_proxy" = []
"location_simulation" = []
"mdns" = []
"misagent" = []
"mobile_image_mounter" = ["dep:sha2"]
"mobileactivationd" = []
"mobilebackup2" = []
"network_monitor" = []
"notification_proxy" = []
"obfuscate" = []
"openssl" = []
"pair" = []
"pcapd" = []
"pinned-usb" = ["usbmuxd", "ring"]
"preboard_service" = []
"remote_pairing" = ["_serde_json", "xpc", "dep:x25519-dalek", "dep:ed25519-dalek", "dep:hkdf", "dep:chacha20poly1305", "dep:zeroize", "ed25519-dalek/zeroize", "dep:idevice-srp", "dep:siphasher", "dep:uuid", "dep:aes", "dep:cbc", "dep:hmac", "dep:sha1", "dep:sha2", "dep:rsa"]
"restore" = []
"restore_recovery" = []
"restore_service" = []
"ring" = ["rustls", "rustls/ring", "tokio-rustls/ring"]
"rsd" = ["xpc"]
"rustcrypto" = []
"rustls" = ["dep:rustls", "dep:tokio-rustls"]
"screenshotr" = []
"springboardservices" = []
"syslog_relay" = []
"sysmontap" = []
"tcp" = []
"tss" = []
"tunnel_tcp_stack" = ["dep:jktcp"]
"tunnel_tcp_stack_pcap" = []
"tunneld" = []
"usbmuxd" = ["tokio/net", "dep:futures"]
"wasm" = []
"wasm-crypto" = []
"wda" = []
"xctest" = []
"xpc" = ["dep:indexmap", "dep:uuid", "dep:async-stream", "dep:futures"]
