<svg width="960" height="528" xml:lang="zh-Hans" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 528" role="img" aria-labelledby="arch-t arch-d"><title id="arch-t">整体架构</title><desc id="arch-d">整体架构：Agent 在 App 内经 HTTPS 调用模型，通过设备工具统一校验截图、换算坐标。Developer Services 经本机 VPN 回环或 USB NCM 中继连接开发者服务，由 XCTest 或 DisplayService／HID 截图与输入；External HID 由 Broadcast Upload Extension 经 ReplayKit 采集屏幕，命令经蓝牙发给 ESP32 开发板，再以 BLE 或 USB HID 报告送入系统输入。</desc><defs><filter id="bsh" x="-60%" y="-50%" width="220%" height="230%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.13" /></filter><marker id="ah" orient="auto" markerWidth="10" markerHeight="10" refX="7.4" refY="5" markerUnits="userSpaceOnUse"><path d="M2 1.6 L7.6 5 L2 8.4" fill="none" stroke="#AEAEB2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></marker><marker id="ahs" orient="auto-start-reverse" markerWidth="10" markerHeight="10" refX="7.4" refY="5" markerUnits="userSpaceOnUse"><path d="M2 1.6 L7.6 5 L2 8.4" fill="none" stroke="#AEAEB2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></marker><linearGradient id="g-purple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9A8CFF" /><stop offset="1" stop-color="#5E5CE6" /></linearGradient><linearGradient id="g-blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5AB0FF" /><stop offset="1" stop-color="#0A6CFF" /></linearGradient><linearGradient id="g-teal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#62D6E8" /><stop offset="1" stop-color="#1AA3C0" /></linearGradient><linearGradient id="g-red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF7A7A" /><stop offset="1" stop-color="#FF3B30" /></linearGradient><linearGradient id="g-orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFBE4D" /><stop offset="1" stop-color="#FF8A00" /></linearGradient><linearGradient id="g-graphite" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#AFAFB4" /><stop off