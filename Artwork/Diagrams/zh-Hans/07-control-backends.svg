<svg width="960" height="340" xml:lang="zh-Hans" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-labelledby="backends-t backends-d"><title id="backends-t">两种软件控制后端</title><desc id="backends-d">XCTest 在同一测试会话内提供截图与输入；iOS 27 路径中 DisplayService 提供屏幕流，HID 服务接收输入，输入只在媒体会话存续时生效。</desc><defs><filter id="bsh" x="-60%" y="-50%" width="220%" height="230%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.13" /></filter><filter id="psh" x="-80%" y="-30%" width="260%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.12" /></filter><marker id="ah" markerWidth="10" markerHeight="10" refX="7.4" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 1.6 L7.6 5 L2 8.4" fill="none" stroke="#AEAEB2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></marker><marker id="ahp" markerWidth="10" markerHeight="10" refX="7.4" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 1.6 L7.6 5 L2 8.4" fill="none" stroke="#5E5CE6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></marker><linearGradient id="g-purple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9A8CFF" /><stop offset="1" stop-color="#5E5CE6" /></linearGradient><linearGradient id="g-blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5AB0FF" /><stop offset="1" stop-color="#0A6CFF" /></linearGradient><linearGradient id="g-teal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#62D6E8" /><stop offset="1" stop-color="#1AA3C0" /></linearGradient><linearGradient id="g-red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF7A7A" /><stop offset="1" stop-color="#FF3B30" /></linearGradient><linearGradient id="g-orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFBE4D" /><stop offset="1" stop-color="#FF8A00" /></linearGradient><linearGradient id="g-graphite" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#AFAFB4" />