<svg width="960" height="236" xml:lang="zh-Hans" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 236" role="img" aria-labelledby="steps-t steps-d"><title id="steps-t">连接开发者服务的步骤</title><desc id="steps-d">App 连接本机开发者服务的步骤：先经 VPN 回环或 USB NCM 建立本机通信，再凭配对记录完成身份认证、建立加密隧道；之后经隧道向 RSD 查询服务与端口，再连接 XCTest 或 DisplayService／HID。配对记录在 iOS 26 上由电脑经 USB 建立后导入，在 iOS 27 上可在手机上建立。</desc><defs><filter id="bsh" x="-60%" y="-50%" width="220%" height="230%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.13" /></filter><marker id="ah" markerWidth="10" markerHeight="10" refX="7.4" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 1.6 L7.6 5 L2 8.4" fill="none" stroke="#AEAEB2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></marker><linearGradient id="g-purple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9A8CFF" /><stop offset="1" stop-color="#5E5CE6" /></linearGradient><linearGradient id="g-blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5AB0FF" /><stop offset="1" stop-color="#0A6CFF" /></linearGradient><linearGradient id="g-teal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#62D6E8" /><stop offset="1" stop-color="#1AA3C0" /></linearGradient><linearGradient id="g-graphite" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#AFAFB4" /><stop offset="1" stop-color="#6E6E73" /></linearGradient></defs><rect width="960" height="236" fill="#FFFFFF" /><rect x="164" y="18" width="312" height="170" rx="24" fill="#F5F5F7" /><text x="320" y="176" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="500" fill="#86868B" text-anchor="middle">要解决的两个问题</text><rect x="51.0" y="40" width="58" height="58" rx="13.6" fill="url(#g-blue)" filter="url(#bsh)" /><rect x="51.5" y="40.5" width="57" height="57" rx="13.1" fill="none" stroke="#fff" stroke-opacity=".22" /><g transform="translate(65.5,54.5) scale(1.812)" fill="none" stroke="#fff" stroke-width="1.02" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="5" height="5" rx="1.4" /><rect x="9" y="2" width="5" height="5" rx="1.4" /><rect x="2" y="9" width="5" height="5" rx="1.4" /><rect x="9" y="9" width="5" height="5" rx="1.4" /></g><text x="80" y="126" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="middle">App</text><text x="80" y="147" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#86868B" text-anchor="middle">控制客户端</text><path d="M117 69.0 H201" fill="none" stroke="#C7C7CC" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)" /><rect x="211.0" y="40" width="58" height="58" rx="13.6" fill="url(#g-purple)" filter="url(#bsh)" /><rect x="211.5" y="40.5" width="57" height="57" rx="13.1" fill="none" stroke="#fff" stroke-opacity=".22" /><g transform="translate(225.5,54.5) scale(1.812)" fill="none" stroke="#fff" stroke-width="1.02" stroke-linecap="round" stroke-linejoin="round"><path d="M2.8 5.4 H12.4 M9.8 2.8 L12.4 5.4 L9.8 8 M13.2 10.6 H3.6 M6.2 8 L3.6 10.6 L6.2 13.2" /></g><text x="240" y="126" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="middle">本机通信</text><text x="240" y="147" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#86868B" text-anchor="middle">VPN 回环或 USB NCM</text><path d="M277 69.0 H361" fill="none" stroke="#C7C7CC" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)" /><rect x="371.0" y="40" width="58" height="58" rx="13.6" fill="url(#g-teal)" filter="url(#bsh)" /><rect x="371.5" y="40.5" width="57" height="57" rx="13.1" fill="none" stroke="#fff" stroke-opacity=".22" /><g transform="translate(385.5,54.5) scale(1.812)" fill="none" stroke="#fff" stroke-width="1.02" stroke-linecap="round" stroke-linejoin="round"><circle cx="5.2" cy="8" r="2.8" /><path d="M8 8 H14 M11.6 8 V10.4 M13.6 8 V9.8" /></g><text x="400" y="126" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="middle">身份认证</text><text x="400" y="147" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#86868B" text-anchor="middle">凭配对记录认证</text><path d="M437 69.0 H521" fill="none" stroke="#C7C7CC" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)" /><rect x="531.0" y="40" width="58" height="58" rx="13.6" fill="url(#g-teal)" filter="url(#bsh)" /><rect x="531.5" y="40.5" width="57" height="57" rx="13.1" fill="none" stroke="#fff" stroke-opacity=".22" /><g transform="translate(545.5,54.5) scale(1.812)" fill="none" stroke="#fff" stroke-width="1.02" stroke-linecap="round" stroke-linejoin="round"><rect x="3.4" y="7.2" width="9.2" height="6.6" rx="1.6" /><path d="M5.4 7.2 V5.4 A2.6 2.6 0 0 1 10.6 5.4 V7.2" /></g><text x="560" y="126" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="middle">加密隧道</text><text x="560" y="147" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#86868B" text-anchor="middle">之后的连接都经隧道</text><path d="M597 69.0 H681" fill="none" stroke="#C7C7CC" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)" /><rect x="691.0" y="40" width="58" height="58" rx="13.6" fill="url(#g-graphite)" filter="url(#bsh)" /><rect x="691.5" y="40.5" width="57" height="57" rx="13.1" fill="none" stroke="#fff" stroke-opacity=".22" /><g transform="translate(705.5,54.5) scale(1.812)" fill="none" stroke="#fff" stroke-width="1.02" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="4.2" /><path d="M10.2 10.2 L13.6 13.6" /></g><text x="720" y="126" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="middle">RSD</text><text x="720" y="147" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#86868B" text-anchor="middle">查询服务与端口</text><path d="M757 69.0 H841" fill="none" stroke="#C7C7CC" stroke-width="1.5" stroke-linecap="round" marker-end="url(#ah)" /><rect x="851.0" y="40" width="58" height="58" rx="13.6" fill="url(#g-graphite)" filter="url(#bsh)" /><rect x="851.5" y="40.5" width="57" height="57" rx="13.1" fill="none" stroke="#fff" stroke-opacity=".22" /><g transform="translate(865.5,54.5) scale(1.812)" fill="none" stroke="#fff" stroke-width="1.02" stroke-linecap="round" stroke-linejoin="round"><rect x="1.6" y="2.6" width="12.8" height="10.8" rx="2" /><path d="M4.6 6.4 L6.6 8 L4.6 9.6 M8.2 10 H11.2" /></g><text x="880" y="126" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="middle">开发者服务</text><text x="880" y="147" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#86868B" text-anchor="middle">XCTest 或</text><text x="880" y="165" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#86868B" text-anchor="middle">DisplayService／HID</text><text x="480" y="222" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#86868B" text-anchor="middle">配对记录：iOS 26 由电脑经 USB 建立后导入；iOS 27 可在手机上建立</text></svg>
