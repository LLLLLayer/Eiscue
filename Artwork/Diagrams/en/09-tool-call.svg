<svg width="960" height="262" xml:lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 262" role="img" aria-labelledby="flow-t flow-d"><title id="flow-t">How one tool call is handled</title><desc id="flow-d">The model taps citing the latest screenshot&#x27;s frameId. The app checks the frame&#x27;s age, orientation, size and session and rejects a stale frame. It then maps coordinates and sends input through the current route, consuming the frame; if delivery is uncertain, the task stops without retrying. A new screenshot and frameId are returned to the model, which decides the next step.</desc><defs><filter id="bsh" x="-60%" y="-50%" width="220%" height="230%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.13" /></filter><marker id="ah" orient="auto" markerWidth="10" markerHeight="10" refX="7.4" refY="5" markerUnits="userSpaceOnUse"><path d="M2 1.6 L7.6 5 L2 8.4" fill="none" stroke="#AEAEB2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></marker><marker id="ahs" orient="auto-start-reverse" markerWidth="10" markerHeight="10" refX="7.4" refY="5" markerUnits="userSpaceOnUse"><path d="M2 1.6 L7.6 5 L2 8.4" fill="none" stroke="#AEAEB2" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" /></marker><linearGradient id="g-purple" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9A8CFF" /><stop offset="1" stop-color="#5E5CE6" /></linearGradient><linearGradient id="g-blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5AB0FF" /><stop offset="1" stop-color="#0A6CFF" /></linearGradient><linearGradient id="g-teal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#62D6E8" /><stop offset="1" stop-color="#1AA3C0" /></linearGradient><linearGradient id="g-red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF7A7A" /><stop offset="1" stop-color="#FF3B30" /></linearGradient><linearGradient id="g-orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFBE4D" /><stop offset="1" stop-color="#FF8A00" /></linearGradient><linearGradient id="g-graphite" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#AFAFB4" /><stop offset="1" stop-color="#6E6E73" /></linearGradient></defs><rect width="960" height="262" fill="#FFFFFF" /><path d="M864 50 V40 Q864 32 856 32 H104 Q96 32 96 40 V46" fill="none" stroke="#C7C7CC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)" /><text x="480" y="22" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="500" fill="#86868B" text-anchor="middle">Decides the next step from the new screen</text><rect x="67.0" y="52" width="58" height="58" rx="13.6" fill="url(#g-blue)" filter="url(#bsh)" /><rect x="67.5" y="52.5" width="57" height="57" rx="13.1" fill="none" stroke="#fff" stroke-opacity=".22" /><g transform="translate(81.5,66.5) scale(1.812)" fill="none" stroke="#fff" stroke-width="1.02" stroke-linecap="round" stroke-linejoin="round"><path d="M4.6 12.6 H11.6 A3 3 0 0 0 11.9 6.6 A4.1 4.1 0 0 0 4 5.6 A3.5 3.5 0 0 0 4.6 12.6 Z" /></g><text x="96" y="134" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="middle">Model</text><text x="96" y="155" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#86868B" text-anchor="middle">Taps citing a frameId</text><path d="M133 81 H249" fill="none" stroke="#C7C7CC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)" /><rect x="259.0" y="52" width="58" height="58" rx="13.6" fill="url(#g-teal)" filter="url(#bsh)" /><rect x="259.5" y="52.5" width="57" height="57" rx="13.1" fill="none" stroke="#fff" stroke-opacity=".22" /><g transform="translate(273.5,66.5) scale(1.812)" fill="none" stroke="#fff" stroke-width="1.02" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.8 L13 3.8 V7.6 C13 10.8 10.8 13.2 8 14.2 C5.2 13.2 3 10.8 3 7.6 V3.8 Z" /><path d="M5.6 8 L7.3 9.7 L10.5 6.4" /></g><text x="288" y="134" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="middle">Validate frame</text><text x="288" y="155" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#86868B" text-anchor="middle">Age, geometry, session</text><path d="M325 81 H441" fill="none" stroke="#C7C7CC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)" /><rect x="451.0" y="52" width="58" height="58" rx="13.6" fill="url(#g-graphite)" filter="url(#bsh)" /><rect x="451.5" y="52.5" width="57" height="57" rx="13.1" fill="none" stroke="#fff" stroke-opacity=".22" /><g transform="translate(465.5,66.5) scale(1.812)" fill="none" stroke="#fff" stroke-width="1.02" stroke-linecap="round" stroke-linejoin="round"><path d="M4.4 2.2 V12.4 L7 10 L8.8 13.8 L10.6 13 L8.8 9.3 L12.3 9.1 Z" /></g><text x="480" y="134" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="middle">Send input</text><text x="480" y="155" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#86868B" text-anchor="middle">Map coordinates, consume frame</text><path d="M517 81 H633" fill="none" stroke="#C7C7CC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)" /><rect x="643.0" y="52" width="58" height="58" rx="13.6" fill="url(#g-red)" filter="url(#bsh)" /><rect x="643.5" y="52.5" width="57" height="57" rx="13.1" fill="none" stroke="#fff" stroke-opacity=".22" /><g transform="translate(657.5,66.5) scale(1.812)" fill="none" stroke="#fff" stroke-width="1.02" stroke-linecap="round" stroke-linejoin="round"><rect x="1.8" y="4.4" width="12.4" height="8.8" rx="1.8" /><path d="M5.6 4.4 L6.6 2.6 H9.4 L10.4 4.4" /><circle cx="8" cy="8.8" r="2.3" /></g><text x="672" y="134" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="middle">Auto screenshot</text><text x="672" y="155" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#86868B" text-anchor="middle">Confirms the result</text><path d="M709 81 H825" fill="none" stroke="#C7C7CC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah)" /><rect x="835.0" y="52" width="58" height="58" rx="13.6" fill="url(#g-graphite)" filter="url(#bsh)" /><rect x="835.5" y="52.5" width="57" height="57" rx="13.1" fill="none" stroke="#fff" stroke-opacity=".22" /><g transform="translate(849.5,66.5) scale(1.812)" fill="none" stroke="#fff" stroke-width="1.02" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2.6" width="12" height="10.8" rx="1.8" /><circle cx="5.8" cy="6.2" r="1.2" /><path d="M2.6 12.4 L6.4 8.8 L9 11 L10.8 9.4 L13.4 11.8" /></g><text x="864" y="134" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="middle">Return screenshot</text><text x="864" y="155" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#86868B" text-anchor="middle">With a new frameId</text><path d="M288 166 V192" fill="none" stroke="#C7C7CC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5" marker-end="url(#ah)" /><rect x="204" y="198" width="168" height="50" rx="14" fill="#F5F5F7" /><text x="288" y="219" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="middle">Stale frame</text><text x="288" y="238" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="400" fill="#86868B" text-anchor="middle">Rejected; observe again</text><path d="M480 166 V192" fill="none" stroke="#C7C7CC" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4 5" marker-end="url(#ah)" /><rect x="396" y="198" width="168" height="50" rx="14" fill="#F5F5F7" /><text x="480" y="219" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600" fill="#1D1D1F" text-anchor="middle">Delivery unknown</text><text x="480" y="238" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="12.5" font-weight="400" fill="#86868B" text-anchor="middle">Task stops, no retry</text></svg>
