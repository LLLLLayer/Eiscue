<svg width="960" height="200" xml:lang="zh-Hans" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" role="img" aria-labelledby="routes-t routes-d"><title id="routes-t">两条设备控制路线</title><desc id="routes-d">开发者服务路线通过 XCTest 或 DisplayService 与 HID 控制设备；外设 HID 路线结合系统屏幕采集与 ESP32 输入控制器。</desc><defs><filter id="bsh" x="-60%" y="-50%" width="220%" height="230%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.13" /></filter><linearGradient id="g-blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5AB0FF" /><stop offset="1" stop-color="#0A6CFF" /></linearGradient><linearGradient id="g-teal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#62D6E8" /><stop offset="1" stop-color="#1AA3C0" /></linearGradient><linearGradient id="g-red" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF7A7A" /><stop offset="1" stop-color="#FF3B30" /></linearGradient><linearGradient id="g-orange" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFBE4D" /><stop offset="1" stop-color="#FF8A00" /></linearGradient><linearGradient id="g-graphite" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#AFAFB4" /><stop offset="1" stop-color="#6E6E73" /></linearGradient></defs><rect width="960" height="200" fill="#FFFFFF" /><path d="M480 24 V188" stroke="#E5E5EA" stroke-width="1" /><text x="240" y="40" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#1D1D1F" text-anchor="middle">Developer Services</text><text x="240" y="62" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" font-weight="400" fill="#86868B" text-anchor="middle">App 调用 iOS 开发者服务</text><text x="240" y="132.0" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="500" fill="#AEAEB2" text-anchor="middle">或</text><rect x="121.0" y="97" width="58" height="58" rx="13.6" fill="url(#g-graphite)" filter="url(#bsh)" /><rect x="121.5" y="97.5" width="57" height="57" rx="13.1" fill="none" stroke="#fff" stroke-opacity=".22" /><g transform="translate(135.5,111.5) scale(1.812)" fill="none" stroke="#fff" stroke-width="1.02" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 V6.2 L2.7 12.4 A1.3 1.3 0 0 0 3.8 14.2 H12.2 A1.3 1.3 0 0 0 13.3 12.4 L10 6.2 V2 M5 2 H11 M4.4 10.2 H11.6" /></g><text x="150" y="179" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="middle">XCTest</text><rect x="301.0" y="97" width="58" height="58" rx="13.6" fill="url(#g-teal)" filter="url(#bsh)" /><rect x="301.5" y="97.5" width="57" height="57" rx="13.1" fill="none" stroke="#fff" stroke-opacity=".22" /><g transform="translate(315.5,111.5) scale(1.812)" fill="none" stroke="#fff" stroke-width="1.02" stroke-linecap="round" stroke-linejoin="round"><rect x="1.6" y="2.4" width="12.8" height="8.8" rx="1.6" /><path d="M5.8 14 H10.2 M8 11.2 V14" /></g><text x="330" y="179" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="16" font-weight="600" fill="#1D1D1F" text-anchor="middle">DisplayService + HID</text><text x="720" y="40" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700" fill="#1D1D1F" text-anchor="middle">External HID</text><text x="720" y="62" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif" font-size="13" font-w